name: Draw Keymap
on:
  push:
    branches:
      - senyoku-mainline
    paths:
      - 'keyboards/zsa/voyager/keymaps/senyoku/keymap.c'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Keymap Drawer
        run: pip install keymap-drawer

      - name: Parse and Draw Keymap
        run: |
          keymap parse -k zsa/voyager keyboards/zsa/voyager/keymaps/senyoku/keymap.c > keymap.yaml
          keymap draw keymap.yaml > voyager_keymap.svg

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Auto] Update keymap SVG diagram"
          file_pattern: "voyager_keymap.svg"
