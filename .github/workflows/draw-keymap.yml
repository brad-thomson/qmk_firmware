name: Draw Keymap

on:
  push:
    branches:
      - senyoku-mainline
    paths:
      - 'keyboards/zsa/voyager/keymaps/senyoku/keymap.c'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QMK and Keymap Drawer
        run: pip install qmk keymap-drawer

      - name: Parse and Draw Keymap
        run: |
          # Convert C keymap to QMK JSON
          qmk c2json -kb zsa/voyager -km senyoku keyboards/zsa/voyager/keymaps/senyoku/keymap.c > keymap.json

          # Convert QMK JSON to Keymap Drawer YAML
          keymap parse -q keymap.json > keymap.yaml

          # Generate SVG inside the keymap folder
          keymap draw keymap.yaml > keyboards/zsa/voyager/keymaps/senyoku/voyager_keymap.svg

      - name: Force Add SVG to Git
        run: |
          # This 'punches through' the .gitignore rules that are blocking the SVG
          git add -f keyboards/zsa/voyager/keymaps/senyoku/voyager_keymap.svg

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Auto] Update keymap SVG diagram"
          # We still point to the specific file to be safe
          file_pattern: "keyboards/zsa/voyager/keymaps/senyoku/voyager_keymap.svg"
          branch: senyoku-mainline
