name: Draw Keymap
on:
  push:
    branches:
      - senyoku-mainline
    paths:
      - 'keyboards/zsa/voyager/keymaps/senyoku/keymap.c'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures the action can see the full history to commit properly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install qmk keymap-drawer

      - name: Parse and Draw Keymap
        run: |
          # 1. Convert C to JSON
          # We run this from the root; QMK CLI will look for the keyboards/ folder automatically
          qmk c2json -kb zsa/voyager -km senyoku keyboards/zsa/voyager/keymaps/senyoku/keymap.c > keymap.json

          # 2. Parse and Draw
          keymap parse -q keymap.json > keymap.yaml
          keymap draw keymap.yaml > voyager_keymap.svg

      - name: Verify SVG Creation
        run: |
          if [ -f "voyager_keymap.svg" ]; then
            echo "SVG created successfully. Size: $(stat -c%s voyager_keymap.svg) bytes"
          else
            echo "Error: voyager_keymap.svg was not created!"
            exit 1
          fi

      - name: Commit updated SVG
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[Auto] Update keymap SVG diagram"
          file_pattern: "voyager_keymap.svg"
          branch: senyoku-mainline # Explicitly tell it which branch to push to
          push_options: '--force'
